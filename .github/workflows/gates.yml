name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . pytest
      - name: Index
        run: pos index
      - name: Lint (cards, contracts, tests, sizes)
        run: pos lint
      - name: Cards are not stale
        run: pos card check
      - name: Ledger entry exists for every commit in this PR
        if: github.event_name == 'pull_request'
        run: pos ledger check --base origin/${{ github.base_ref }}
      - name: Contract change needs human approval
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^contracts/'; then
            echo "::warning::contracts/ changed — a human must approve this PR (branch protection: require review)"
            pos impact --diff --base origin/${{ github.base_ref }} || true
          fi
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run gen:types
      - name: Impact-selected tests (TypeScript)
        run: |
          TESTS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TESTS=$(pos impact --diff --base origin/${{ github.base_ref }} --json | python -c 'import json,sys; print(" ".join(f for f in json.load(sys.stdin)["tests"] if f.endswith(".ts")))' || true)
          fi
          if [ -n "$TESTS" ]; then echo "running: $TESTS"; npx vitest run $TESTS; else npx vitest run; fi
      - run: npm run typecheck
      - name: Kit self-test
        run: python -m pytest -q tests  # gates smoke on this repo
      - name: Metrics record exists for this PR's issue (protocol §1)
        if: github.event_name == 'pull_request'
        env: { PR_BODY: "${{ github.event.pull_request.body }}" }
        run: |
          ISSUE=$(echo "$PR_BODY" | grep -oiE '(closes|fixes|resolves) #[0-9]+' | head -1 | grep -oE '#[0-9]+' || true)
          if [ -z "$ISSUE" ]; then echo "::error::PR body must contain 'Closes #<issue>'"; exit 1; fi
          pos metrics check --issue "$ISSUE"
      - name: Upload research artefacts
        uses: actions/upload-artifact@v4
        with:
          name: project-os-metrics-${{ github.run_id }}
          path: |
            .project-os/metrics.jsonl
            .project-os/queries.log
          if-no-files-found: ignore
