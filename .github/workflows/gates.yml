name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . pytest
      - name: Index
        run: pos index
      - name: Lint (cards, contracts, tests, sizes)
        run: pos lint
      - name: Cards are not stale
        run: pos card check
      - name: Ledger entry exists for every commit in this PR
        if: github.event_name == 'pull_request'
        run: pos ledger check --base origin/${{ github.base_ref }}
      - name: Contract change needs human approval
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^contracts/'; then
            echo "::warning::contracts/ changed — a human must approve this PR (branch protection: require review)"
            pos impact --diff --base origin/${{ github.base_ref }} || true
          fi
      - name: Impact-selected tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TESTS=$(pos impact --diff --base origin/${{ github.base_ref }} --json | python -c 'import json,sys; print(" ".join(json.load(sys.stdin)["tests"]))' || true)
          fi
          if [ -n "$TESTS" ]; then echo "running: $TESTS"; python -m pytest -q $(echo $TESTS | tr ' ' '\n' | grep '\.py$'); fi
      - name: Kit self-test
        run: python -m pytest -q tests
