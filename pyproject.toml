[project]
name = "project-os"
version = "0.1.0"
description = "Contract-bounded agentic development kit: deterministic repo graph, module cards, impact analysis, CI gates."
requires-python = ">=3.10"
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-typescript>=0.23",
]

[project.scripts]
pos = "pos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pos"]
